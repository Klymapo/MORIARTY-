<!doctype html>
<html lang="es-MX">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#182b38"><title>MORIARTY · Estudio de escritura</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong class="brand">MORIARTY</strong><span id="libraryTitle">Tu biblioteca</span><input id="projectTitle" aria-label="Título del libro" hidden><span id="saved" role="status">Cargando…</span><button id="export" data-icon="download">Respaldar biblioteca</button><button id="import" data-icon="upload">Importar</button><button id="new" data-icon="plus">Nuevo libro</button><input type="file" id="file" accept=".json" hidden></header>
<nav aria-label="Espacios"><button data-view="library">Biblioteca</button><button data-view="write">Escribir</button><button data-view="board">Tablero</button><button data-view="archive">Archivo</button><button data-view="timeline">Cronología</button><button data-view="review">Revisiones</button></nav>
<section id="recoveryBanner" class="notice" role="alert" hidden><strong>No se pudo leer el guardado.</strong> Conservamos el contenido original y bloqueamos su sobrescritura. Importa un respaldo o descarga el dato de recuperación antes de empezar de nuevo.<div class="toolbar"><button id="downloadRecovery" data-icon="download">Descargar dato de recuperación</button><button id="resetLibrary" data-icon="restore">Iniciar biblioteca nueva</button></div></section>
<div class="shell"><aside id="sidebar"></aside><main id="main"></main></div>
<footer><span id="words"></span><span>MORIARTY V0.2 · Tus historias, a tu manera</span><button id="txt" data-icon="text">Descargar TXT</button></footer><div id="toast" role="status"></div><script type="module" src="app.js"></script>
</body></html>
